services:
  sim:
    build:
      context: ./sim
    # Explicit networks keep sim out of Harbor's egress-control namespace when the allowlist is on.
    networks: [default]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 2s
      timeout: 5s
      retries: 30
  main:
    depends_on:
      sim:
        condition: service_healthy
